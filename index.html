<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="Stylesheet" href="style.css">
</head>

<body>
    <div align="Center" width="150%">
        <h1><u>Number Guessing Game</u></h1><br><br>
        <h2 style="color: crimson;">You have 3 guessings </h2>
        <h3>Guess a number between 1 and 10</h3>
        <input type="text" id="guessInput" placeholder="Enter your guess">
        <button id="guessButton" onclick="getRandomNumber()">Guess</button>
        <h4>Do you want to restart the Game ? <button id="restart" onclick="restartgame()">Restart</button>
        </h4>

        <table border="1" id="tblHistoryofGame" width="50%">
            <caption>Game History</caption>
            <tbody>
                <tr align="Center">
                    <td>No of Attempts</td>
                    <td>Guessing No</td>
                    <td>Result</td>
                </tr>
            </tbody>
        </table>
        <div id="randomNo"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>

</html>
